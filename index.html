<style>
/* Links da bio: uma coluna estreita, logo no topo e botões em pílula. */
body { min-height: 100dvh; display: flex; flex-direction: column; }
main { flex: 1; display: grid; align-content: center; justify-items: center; gap: 2rem; padding-block: clamp(2.5rem, 8vh, 5rem); text-align: center; }
.brand .logo { height: auto; width: min(15rem, 62vw); margin-inline: auto; }
.brand p { margin: 1rem 0 0; font-style: italic; color: var(--ink-soft); }
.photo { width: min(9.5rem, 38vw); aspect-ratio: 2 / 3; object-fit: cover; box-shadow: 0 18px 36px -20px rgba(60, 0, 10, .6); transform: rotate(-3deg); }
.links { width: min(100%, 24rem); display: grid; gap: .8rem; padding: 0; margin: 0; list-style: none; }
.links a { display: flex; align-items: center; justify-content: center; min-height: 3.4rem; padding: .8rem 1.4rem; border-radius: 999px; border: 1px solid var(--wine); font-style: italic; font-size: 1.05rem; text-decoration: none; transition: background .2s, color .2s, transform .2s; }
.links a:hover { transform: translateY(-1px); }
.links .main { background: var(--wine); color: var(--cream); }
.links .main:hover { background: var(--wine-deep); }
.links .alt { color: var(--accent); border-color: var(--accent); }
.links .alt:hover { background: var(--accent); color: var(--cream); }
.bye { margin: 0; font-style: italic; font-size: .95rem; color: var(--ink-soft); max-width: 18rem; }
</style>
