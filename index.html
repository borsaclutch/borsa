/* Réplica da página do Carrd (borsa.carrd.co): mesmas medidas, cores e fontes. */
html,body,div,span,h1,p,a,img,ul,li,svg{margin:0;padding:0;border:0;font-size:100%;font:inherit;vertical-align:baseline}
ul{list-style:none}
*,*::before,*::after{box-sizing:border-box}
body{line-height:1;min-height:100vh;min-width:320px;overflow-x:hidden;word-wrap:break-word;background-color:#FFFEE7;-webkit-text-size-adjust:none}
html{font-size:18pt}
.site-wrapper{align-items:center;display:flex;flex-direction:column;justify-content:center;min-height:100vh;overflow:hidden;position:relative}
.site-main{--alignment:center;--flex-alignment:center;align-items:center;display:flex;justify-content:center;max-width:100%;position:relative;text-align:center}
.site-main>.inner{--padding-horizontal:3rem;--padding-vertical:3rem;--spacing:1.5rem;--width:35rem;max-width:100%;position:relative;width:var(--width);padding:var(--padding-vertical) var(--padding-horizontal)}
.site-main>.inner>*{margin-top:var(--spacing);margin-bottom:var(--spacing)}
.site-main>.inner>:first-child{margin-top:0!important}
.site-main>.inner>:last-child{margin-bottom:0!important}

.image-component{display:block;line-height:0;max-width:100%;position:relative}
.image-component>.frame{display:inline-block;max-width:100%;overflow:hidden;vertical-align:top;width:9rem;border-radius:100%;border:4px solid #434F2F}
.image-component>.frame>img{border-radius:inherit;max-width:100%;vertical-align:top;width:inherit;height:auto;padding:.125rem;display:block}

.text-component{position:relative}
.text-component.t-title{color:#9A153F;font-family:'Raleway',sans-serif;letter-spacing:-.175rem;width:100%;font-size:3.875em;line-height:1;font-weight:400}
.text-component.t-sub{color:#434F2F;font-family:'Raleway',sans-serif;font-size:1em;line-height:1.875;font-weight:300}
.text-component.t-body{color:rgba(0,0,0,.761);font-family:'Raleway',sans-serif;font-size:.875em;line-height:1.875;font-weight:300}

.icons-component{display:flex;flex-wrap:wrap;justify-content:center;letter-spacing:0;padding:0;font-size:2.125em;gap:1.625rem}
.icons-component:not(:first-child){margin-top:2.5rem!important}
.icons-component:not(:last-child){margin-bottom:2.5rem!important}
.icons-component>li{position:relative;z-index:1}
.icons-component>li>a{align-items:center;display:flex;justify-content:center;border-radius:100%;height:2em;width:2em;background-color:#FFFEE7;border:1px solid #434F2F;box-shadow:0 0 0 .125rem #000;transition:transform .375s ease,background-color .375s ease}
.icons-component>li>a>svg{display:block;pointer-events:none;position:relative;height:60%;width:60%;fill:#FFFEE7}
.icons-component>li>a>.label{display:none}
.icons-component>li>a:hover{transform:scale(1.1125)}
.icons-component>li>a.n01{background-color:#73805E}
.icons-component>li>a.n02{background-color:#631313}
.icons-component>li>a.n03{background-color:#C78008}

.buttons-component{display:flex;justify-content:center;letter-spacing:0;padding:0;gap:1.75rem;flex-direction:row;flex-wrap:wrap}
.buttons-component:not(:first-child){margin-top:2.5rem!important}
.buttons-component:not(:last-child){margin-bottom:2.5rem!important}
.buttons-component>li{max-width:100%;text-align:center}
.buttons-component>li>a{display:inline-flex;align-items:center;justify-content:flex-end;flex-direction:row-reverse;max-width:100%;width:100vw;height:4rem;line-height:calc(4rem - 2px);padding:0 2rem;text-align:center;text-decoration:none;vertical-align:middle;white-space:nowrap;text-transform:uppercase;font-family:'Raleway',sans-serif;font-size:1.125em;font-weight:800;border-radius:2.5rem;border:1px solid #9A153F;box-shadow:0 0 0 .125rem #000;background-color:#fff;color:#000;transition:transform .125s ease,color .125s ease,background-color .125s ease,border-color .125s ease}
.buttons-component>li>a>svg{display:block;fill:#434F2F;flex-grow:0;flex-shrink:0;height:100%;min-width:18px;pointer-events:none;width:1.25em;margin-left:.75rem;margin-right:calc(-.125em + 0rem)}
.buttons-component>li>a>.label{overflow:hidden;flex-grow:1;flex-shrink:1;text-align:left;width:100%}
.buttons-component>li>a:hover{transform:scale(1.0425)}
.buttons-component>li>a.n01{background-color:transparent;color:#434F2F}
.buttons-component>li>a.n02{background-color:rgba(255,0,0,.012);color:#424F2F}
.buttons-component>li>a.n03{background-color:rgba(255,0,0,.012);color:#434F2F}
.buttons-component>li>a:hover{background-color:#9A153F!important}
:focus-visible{outline:3px solid #9A153F;outline-offset:3px}

@media (max-width:1680px){html{font-size:13pt}}
@media (max-width:980px){html{font-size:11pt}}
@media (max-width:736px){
  .site-main>.inner{--padding-horizontal:2rem;--padding-vertical:3rem;--spacing:1.5rem}
  .text-component.t-title{letter-spacing:-.153125rem;font-size:2.5em}
  .icons-component{gap:1.25rem}
  .buttons-component>li>a{letter-spacing:0;font-size:.875em}
}
@media (max-width:480px){
  .site-main>.inner{--spacing:1.3125rem}
  .buttons-component{flex-direction:column;flex-wrap:nowrap}
  .buttons-component>li>a{max-width:100%;width:100%}
}
@media (max-width:360px){
  .site-main>.inner{--padding-horizontal:1.5rem;--padding-vertical:2.25rem;--spacing:1.125rem}
  .icons-component{gap:.9375rem}
  .buttons-component{gap:1.3125rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
